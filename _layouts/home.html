{%- include head.html -%}

<div id="merit-logo">
  <div style="text-align: center;">
    <div class="wrapper">
      <img src="{{site.images_path | relative_url}}MeritLogo.png" alt="MeRIT" width="200" height="200"> 
    </div>
  </div>
</div>

<div style="text-align: center;">
  <div class="package-text">
    <h2>Welcome to MeRIT (Method Reporting with Initials for Transparency)</h2>
    <br>
  </div>
</div>

<div style="text-align: center;">
  <div class="package-text">
    <h3>Now published in <a href="https://doi.org/10.1038/s41467-023-37039-1">Nature Communications</a></h3>
    <div style="display: flex; justify-content: center;">
      <span class="altmetric-embed" data-badge-type="donut" data-doi="10.1038/s41467-023-37039-1"></span> 
      <span class="__dimensions_badge_embed__" data-doi="10.1038/s41467-023-37039-1" data-style="small_circle"></span>
    </div>
  </div>
</div>

<div style="border:1px solid #000; padding:10px; margin:10px; font-family: Arial, sans-serif; text-align: left;">
  <h3>List of papers that use the MeRIT system:</h3>
  <ul id="citation-list">Loading...</ul>
</div>

<script>
  async function loadCitations() {
    const openalexId = "W4362523552";
    const response = await fetch(`https://api.openalex.org/works?filter=cites:${openalexId}&per-page=100`);
    const data = await response.json();
    const list = document.getElementById('citation-list');
    list.innerHTML = "";

    data.results.forEach((work, index) => {
      const title = work.title || "Untitled";
      const year = work.publication_year || "n.d.";
      const authors = work.authorships.map(a => a.author.display_name).join(", ");
      const doi = work.doi ? `https://doi.org/${work.doi}` : work.id;

      const li = document.createElement("li");
      li.style.marginBottom = "1.5em"; // gap between citations
      li.innerHTML = `<strong>${index + 1}.</strong> ${authors}. <em>${title}</em>. Published ${year}. <a href="${doi}" target="_blank">${doi}</a>`;
      list.appendChild(li);
    });
  }

  loadCitations();
</script>

<script type='text/javascript' src='https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js'></script>
<script async src="https://badge.dimensions.ai/badge.js" charset="utf-8"></script>
