<div style="text-align: center;">
  <div class="package-text">
    <h2>Welcome to MeRIT (Method Reporting with Initials for Transparency)</h2>
    <br>
  </div>
</div>

<div style="text-align: center;">
  <div class="package-text">
    <h3>Now published in <a href="https://doi.org/10.1038/s41467-023-37039-1">Nature Communications</a></h3>
    <div style="display: flex; justify-content: center;">
      <span class="altmetric-embed" data-badge-type="donut" data-doi="10.1038/s41467-023-37039-1"></span> 
      <span class="__dimensions_badge_embed__" data-doi="10.1038/s41467-023-37039-1" data-style="small_circle"></span>
    </div>
  </div>
</div>

<div style="border:1px solid #000; padding:10px; margin:10px; font-family: Arial, sans-serif; text-align: left;">
  <h3>List of papers that use the MeRIT system (sourced from OpenAlex:</h3>
  <p id="citation-count" style="font-style: italic; margin: 0 0 10px 0;">Loading citations…</p>
  <ol id="citation-list" style="margin-left: 1.2em; padding-left: 0;">
    <li>Loading citations…</li>
  </ol>
</div>

<script>
async function fetchCrossRefData(doi) {
  const url = `https://api.crossref.org/works/${encodeURIComponent(doi)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("CrossRef fetch failed");
    const data = await res.json();
    return data.message;
  } catch (e) {
    console.warn(`Failed to fetch CrossRef data for DOI: ${doi}`, e);
    return null;
  }
}

function formatAuthors(authors) {
  if (!authors || authors.length === 0) return "Unknown author";
  return authors.map(a => {
    const family = a.family || "";
    const given = a.given || "";
    const initials = given.split(" ").map(n => n[0]?.toUpperCase() + ".").join("");
    return `${family} ${initials}`;
  }).join(", ");
}

function formatCitation(meta) {
  const authors = formatAuthors(meta.author);
  const title = meta.title ? meta.title[0] : "Untitled";
  const year = meta.published?.["date-parts"]?.[0]?.[0] || "n.d.";
  const doi = meta.DOI ? `https://doi.org/${meta.DOI}` : "";
  return `${authors}. <em>${title}</em>. ${year}. ${doi ? `<a href="${doi}" target="_blank">${doi}</a>` : ""}`;
}

async function loadCitations() {
  const openalexId = "W4362523552";
  let cursor = "*";
  let allResults = [];

  const list = document.getElementById("citation-list");
  const countEl = document.getElementById("citation-count");

  try {
    // fetch all citing works
    while (cursor) {
      const url = `https://api.openalex.org/works?filter=cites:${openalexId}&per-page=100&cursor=${cursor}`;
      const response = await fetch(url);
      const data = await response.json();

      allResults = allResults.concat(data.results);
      cursor = data.meta.next_cursor || null;
    }

    // enrich with CrossRef if possible, otherwise use OpenAlex
    const enriched = await Promise.all(allResults.map(async (work) => {
      if (work.doi) {
        const meta = await fetchCrossRefData(work.doi);
        if (meta) return meta;
      }
      // fallback: build from OpenAlex
      return {
        author: work.authorships?.map(a => {
          const parts = a.author?.display_name?.split(" ") || [];
          return {
            family: parts.slice(-1)[0],
            given: parts.slice(0, -1).join(" ")
          };
        }),
        title: [work.display_name],
        published: { "date-parts": [[work.publication_year]] },
        DOI: work.doi || ""
      };
    }));

    // sort newest first
    const sorted = enriched
      .filter(e => e !== null)
      .sort((a, b) => {
        const yearA = a.published?.["date-parts"]?.[0]?.[0] || 0;
        const yearB = b.published?.["date-parts"]?.[0]?.[0] || 0;
        return yearB - yearA;
      });

    // render
    list.innerHTML = "";
    countEl.textContent = `${sorted.length} citations found`;

    sorted.forEach((meta) => {
      const li = document.createElement("li");
      li.style.marginBottom = "1.5em";
      li.innerHTML = formatCitation(meta);
      list.appendChild(li);
    });

  } catch (err) {
    console.error("Error loading citations:", err);
    countEl.textContent = "Failed to load citations.";
    list.innerHTML = "";
  }
}

loadCitations();
</script>
