<div style="text-align: center;">
  <div class="package-text">
    <h2>Welcome to MeRIT (Method Reporting with Initials for Transparency)</h2>
    <br>
  </div>

<div style="text-align: center;">
  <div class="package-text">
    <h3>Now published in <a href="https://doi.org/10.1038/s41467-023-37039-1">Nature Communications</a></h3>
    <div style="display: flex; justify-content: center;">
      <span class="altmetric-embed" data-badge-type="donut" data-doi="10.1038/s41467-023-37039-1"></span>

<div style="border:1px solid #000; padding:10px; margin:10px; font-family: Arial, sans-serif; text-align: left;">
  <h3>List of papers that use the MeRIT system (listed on OpenAlex):</h3>
  <ol id="citation-list" style="margin-left: 1.2em; padding-left: 0;"></ol>
</div>

<script>
async function fetchCrossRefData(doi) {
  const url = `https://api.crossref.org/works/${encodeURIComponent(doi)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("CrossRef fetch failed");
    const data = await res.json();
    return data.message;
  } catch (e) {
    console.warn(`Failed to fetch CrossRef data for DOI: ${doi}`, e);
    return null;
  }
}

function formatAuthors(authors) {
  if (!authors || authors.length === 0) return "Unknown author";
  return authors.map(a => {
    const family = a.family || "";
    const given = a.given || "";
    const initials = given.split(" ").map(n => n[0]?.toUpperCase() + ".").join("");
    return `${family} ${initials}`;
  }).join(", ");
}

function formatCitation(meta) {
  const authors = formatAuthors(meta.author);
  const title = meta.title ? meta.title[0] : "Untitled";
  const year = meta.published?.["date-parts"]?.[0]?.[0] || "n.d.";
  const doi = meta.DOI ? `https://doi.org/${meta.DOI}` : "";

  return `${authors}. <em>${title}</em>. ${year}. <a href="${doi}" target="_blank">${doi}</a>`;
}

async function loadCitations() {
  const openalexId = "W4362523552";
  const response = await fetch(`https://api.openalex.org/works?filter=cites:${openalexId}&per-page=100`);
  const data = await response.json();

  const enriched = await Promise.all(data.results.map(async (work) => {
    if (!work.doi) return null;
    const meta = await fetchCrossRefData(work.doi);
    return meta;
  }));

  const sorted = enriched
    .filter(e => e !== null)
    .sort((a, b) => {
      const yearA = a.published?.["date-parts"]?.[0]?.[0] || 0;
      const yearB = b.published?.["date-parts"]?.[0]?.[0] || 0;
      return yearB - yearA;
    });

  const list = document.getElementById("citation-list");
  list.innerHTML = "";

  sorted.forEach((meta, i) => {
    const li = document.createElement("li");
    li.style.marginBottom = "1.5em";
    li.innerHTML = formatCitation(meta);
    list.appendChild(li);
  });
}

loadCitations();
</script>
